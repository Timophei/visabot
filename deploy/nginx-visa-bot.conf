# /etc/nginx/sites-available/visa-bot
# Отдельный поддомен на том же сервере. Замените visa.gorodchaya.ru на свой.
server {
    listen 80;
    server_name visa.gorodchaya.ru;

    root /var/www/visa-bot/public;   # наружу смотрит ТОЛЬКО папка public
    index index.html index.php;

    client_max_body_size 100m;       # загрузка больших PDF в админке

    location / {
        try_files $uri $uri/ =404;
    }

    location ~ \.php$ {
        try_files $uri =404;
        include snippets/fastcgi-php.conf;
        fastcgi_pass unix:/run/php/php8.3-fpm.sock;
        fastcgi_read_timeout 300;    # индексация PDF и ответы нейросети
    }

    # Админку можно дополнительно закрыть по IP:
    # location ^~ /admin/ { allow 1.2.3.4; deny all; location ~ \.php$ { include snippets/fastcgi-php.conf; fastcgi_pass unix:/run/php/php8.3-fpm.sock; fastcgi_read_timeout 300; } }

    location ~ /\. { deny all; }
}
# HTTPS: sudo certbot --nginx -d visa.gorodchaya.ru
