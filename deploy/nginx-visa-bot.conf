# /etc/nginx/sites-available/visa-bot
# Отдельный поддомен на том же сервере. Замените visabot.b-integration.ru на свой.
server {
    listen 80;
    server_name visabot.b-integration.ru;

    root /var/www/visa-bot/public;   # наружу смотрит ТОЛЬКО папка public
    index index.html index.php;

    client_max_body_size 200m;       # загрузка больших PDF и ZIP в админке

    location / {
        try_files $uri $uri/ =404;
    }

    location ~ \.php$ {
        include snippets/fastcgi-php.conf;
        fastcgi_pass unix:/run/php/php8.3-fpm.sock;
        fastcgi_read_timeout 1800;   # индексация больших архивов (до 30 мин) и ответы нейросети
    }

    # Админку можно дополнительно закрыть по IP:
    # location ^~ /admin/ { allow 1.2.3.4; deny all; location ~ \.php$ { include snippets/fastcgi-php.conf; fastcgi_pass unix:/run/php/php8.3-fpm.sock; fastcgi_read_timeout 1800; } }

    location ~ /\. { deny all; }
}
# HTTPS: sudo certbot --nginx -d visabot.b-integration.ru
