; Лимиты PHP только для админки (PHP-FPM читает этот файл сам, правка php.ini не нужна).
; Изменения подхватываются в течение ~5 минут (user_ini.cache_ttl) или сразу после reload php8.3-fpm.
upload_max_filesize = 200M
post_max_size = 210M
memory_limit = 1024M
max_execution_time = 0
max_input_time = 900
